<header>
  <h1 class="app-title">DBC Viewer</h1>
  <span class="small text-body-secondary">Browse CAN database files in a human-friendly way</span>
  <div class="d-flex gap-2 ms-auto align-items-center">
    <button
      type="button"
      [attr.aria-label]="
        themeService.resolved() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
      (click)="themeService.toggle()"
    >
      <i
        class="bi"
        aria-hidden="true"
        [class.bi-moon]="themeService.resolved() === 'dark'"
        [class.bi-sun]="themeService.resolved() === 'light'"
      ></i>
    </button>
  </div>
</header>
<main>
  <div class="flex-grow-1 d-flex flex-column overflow-y-auto p-3">
    <router-outlet />
  </div>
</main>
<footer>
  <span>Runs entirely in your browser — files are never uploaded.</span>
</footer>
